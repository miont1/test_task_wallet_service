name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  provider-mock:
    name: Provider Mock CI (Lint & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: provider_mock/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r provider_mock/requirements.txt

      - name: Run Ruff Lint
        run: python -m ruff check provider_mock

      - name: Run Ruff Format Check
        run: python -m ruff format --check provider_mock

      - name: Run Pytest
        run: python -m pytest provider_mock/tests

  wallet-service:
    name: Wallet Service CI (Lint, Migrations & Test with PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wallet_test_db
          POSTGRES_USER: wallet_user
          POSTGRES_PASSWORD: wallet_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://wallet_user:wallet_test_password@localhost:5432/wallet_test_db
      DATABASE_URL: postgresql+asyncpg://wallet_user:wallet_test_password@localhost:5432/wallet_test_db
      PROVIDER_BASE_URL: http://localhost:8001
      PROVIDER_API_KEY: mock-provider-key-123
      PROVIDER_WEBHOOK_SECRET: mock-webhook-secret-456
      WALLET_CALLBACK_URL: http://localhost:8000/v1/webhooks/provider
      ENVIRONMENT: testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: wallet_service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r wallet_service/requirements.txt

      - name: Run Ruff Lint
        run: python -m ruff check wallet_service

      - name: Run Ruff Format Check
        run: python -m ruff format --check wallet_service

      - name: Run Alembic Migrations on PostgreSQL
        run: python -m alembic -c wallet_service/alembic.ini upgrade head

      - name: Run Pytest with PostgreSQL
        run: python -m pytest wallet_service/tests
